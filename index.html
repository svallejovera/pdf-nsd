<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View the attached PDF document.">
  <title>Document</title>
  <style>
    html, body, main, iframe { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }
    iframe { display: block; border: 0; }
    .fallback { padding: 1rem; font: 16px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <iframe src="document.pdf" title="PDF document">
      <p class="fallback">Your browser cannot display the PDF inline.
        <a href="document.pdf">Open or download the PDF</a>.
      </p>
    </iframe>
  </main>
</body>
</html>
